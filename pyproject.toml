[project]
name = "quantrade"
version = "3.0.0"
description = "ETF中低频交易研究、模型预测、多因子决策与份额账本"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0,<2.2.0",
    "numpy>=1.24.0,<2.0.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0,<1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff",
]
data = ["akshare>=1.14.0"]
ui = ["streamlit>=1.50.0", "plotly>=5.0"]
legacy = ["python-dotenv>=1.0.0", "optuna>=3.5.0", "bt>=1.1.0", "ffn>=1.1.0", "matplotlib>=3.8.0", "requests>=2.31.0", "schedule>=1.2.0"]

[project.scripts]
quantrade = "quantrade.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/v3"]
pythonpath = ["src"]
